# Local development database only.
# The SA password below is a throwaway LOCAL DEVELOPMENT credential — never reuse it anywhere.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mihira-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "MihiraDev_Passw0rd!"
      MSSQL_PID: "Developer"
    ports:
      - "14333:1433"
    volumes:
      - mihira-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mihira-sql-data:
